name: ServeQR CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx --test src/domain/serveqrLogic.test.ts src/services/mappers.test.ts
      - run: npm run build

  backend:
    name: Backend Prisma, TypeCheck & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  docker-verify:
    name: Verify Docker Images Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker build -t serveqr-backend:ci ./backend
      - name: Build Frontend Docker Image
        run: docker build -t serveqr-frontend:ci -f Dockerfile.frontend .
